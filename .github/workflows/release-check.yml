name: Release readiness

# Runs on every pull request into main, alongside CI, CodeQL and the branch rules. A pull request that changes
# release.json will publish that version when merged, so it must state a version newer than the latest
# release, have a changelog section for it, and package cleanly. One that doesn't change release.json
# releases nothing, and this check just says so.
on:
  pull_request:
    branches: [main]

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check release.json
        id: release
        env:
          BASE: ${{ github.base_ref }}
        run: |
          VERSION=$(node scripts/version.mjs) || exit 1
          if git diff --quiet "origin/$BASE" HEAD -- release.json; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "### No release: release.json is unchanged, so merging publishes nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! NEWER=$(node scripts/version.mjs --newer 2>&1); then
            echo "::error::$NEWER"
            exit 1
          fi
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Move the Unreleased notes under it."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Merging releases **$VERSION**"
            echo "- $NEWER"
            echo "- Changelog section found"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: steps.release.outputs.release == 'true'
        run: npm ci

      # The same packaging the release does, so a broken zip shows up before the merge.
      - name: Package the extension
        if: steps.release.outputs.release == 'true'
        run: sh scripts/package-extension.sh
