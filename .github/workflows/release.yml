name: Release

# release.json decides releases. When a merge into main changes it, and the version it states is newer than
# the latest release, this runs every check again and, if they all pass, publishes a GitHub Release with the
# extension zips, the helper for macOS, Linux and Windows, and the installers. Merges that don't change release.json don't start it, and a
# version that isn't newer publishes nothing. After a failed run, start it again from
# Actions → Release → Run workflow on main; the same rules apply.
#
# Optional secrets of the "release" environment (Settings → Environments → release, with deployment branches
# limited to main):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET   addons.mozilla.org API keys. When set, each release is submitted to
#                                    Firefox Add-ons, and Firefox updates everyone once Mozilla approves it.
#                                    Without them the Firefox upload is skipped.
#
# Optional repository variable:
#   AMO_CHANNEL   listed (the default): publish on the public Firefox Add-ons listing, which updates
#                 itself. unlisted: sign only, and attach the signed .xpi to the GitHub release instead.
#                 The first listed version is submitted by hand on addons.mozilla.org, with its listing.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # Releases come from main only, also when started by hand: main is where the repository rules apply.
    # Every other job needs this one, so on any other branch nothing runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read release.json
        id: plan
        run: |
          VERSION=$(node scripts/version.mjs) || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if NEWER=$(node scripts/version.mjs --newer 2>&1); then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing: $NEWER." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing was published: $NEWER" >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  helper-macos:
    name: Helper for macOS
    needs: [plan, checks]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # One archive per kind of Mac, each with that chip's ffmpeg and QuickJS.
      - name: Build and package for Apple silicon and Intel
        run: |
          for arch in arm64 x86_64; do
            [ $arch = arm64 ] && target=aarch64-apple-darwin || target=x86_64-apple-darwin
            cargo build --release --locked --manifest-path helper/Cargo.toml --target $target
            sh helper/fetch-engine.sh $arch
            sh scripts/package-helper.sh macos-$arch helper/target/$target/release/clipsave-helper
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-macos
          path: dist/clipsave-helper-macos-*.tar.gz

  helper-linux:
    name: Helper for Linux
    needs: [plan, checks]
    # The oldest supported runner, so the binary runs on older Linux systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build and package with yt-dlp
        run: |
          cargo build --release --locked --manifest-path helper/Cargo.toml
          sh helper/fetch-engine.sh
          sh scripts/package-helper.sh linux-x86_64 helper/target/release/clipsave-helper

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-linux
          path: dist/clipsave-helper-linux-x86_64.tar.gz

  helper-windows:
    name: Helper for Windows
    needs: [plan, checks]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build and package with its tools
        run: |
          cargo build --release --locked --manifest-path helper/Cargo.toml
          sh helper/fetch-engine.sh
          sh scripts/package-helper.sh windows-x86_64 helper/target/release/clipsave-helper.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-windows
          path: dist/clipsave-helper-windows-x86_64.zip

  publish:
    name: Publish
    needs: [plan, checks, helper-macos, helper-linux, helper-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Settings → Environments → release: limited to main, and holding the AMO_JWT_* secrets, so only this
    # job on main can read them.
    environment: release
    permissions:
      contents: write
      # For the build attestations below.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Only whether the keys exist. The keys themselves reach the one step that signs, not npm ci or the build.
      AMO_READY: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
      AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'listed' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gh uses GH_TOKEN below; nothing here pushes, so the write token isn't left in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package the extension
        run: sh scripts/package-extension.sh

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: helper-*
          path: dist
          merge-multiple: true

      - name: Submit the Firefox add-on
        if: env.AMO_READY == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # The GitHub release goes out either way: a listing that doesn't exist yet, or a review hiccup on
        # Firefox Add-ons, shows as a failed step here and is retried by hand on addons.mozilla.org.
        continue-on-error: true
        run: |
          if [ "$AMO_CHANNEL" = unlisted ]; then
            npx web-ext sign --channel unlisted \
              --source-dir .output/firefox-mv2 \
              --upload-source-code "dist/ClipSave-$VERSION-sources.zip" \
              --artifacts-dir signed \
              --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
            mv signed/*.xpi "dist/ClipSave-$VERSION-firefox.xpi"
          else
            # Listed versions are reviewed by Mozilla before Firefox offers them, so this only submits.
            # Once approved, every Firefox with ClipSave from Firefox Add-ons updates by itself.
            npx web-ext sign --channel listed --approval-timeout 0 \
              --source-dir .output/firefox-mv2 \
              --upload-source-code "dist/ClipSave-$VERSION-sources.zip" \
              --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          fi

      - name: Add the installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum ClipSave-* clipsave-helper-* clipsave-extension-* install.sh install.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A signed record that these exact files came from this workflow, this repository and this commit.
      # Anyone can check one with `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/ClipSave-*
            dist/clipsave-helper-*
            dist/clipsave-extension-*
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md for what changed." > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<EOF

          ---

          **Install:** add the extension, then click its button: it shows the one command that installs the helper.
          Full guide: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/install.md).

          - macOS, Linux: \`curl -fsSL https://ext.clipsave.link/install.sh | sh\`
          - Windows (PowerShell): \`irm https://ext.clipsave.link/install.ps1 | iex\`

          Extension: Firefox Add-ons for Firefox (updates itself). Chrome, Edge and Brave: the install command also
          puts the extension next to the helper; load that folder with **Load unpacked** and Settings updates it in
          one click. \`ClipSave-$VERSION-chrome-unpacked.zip\` is the same build, for loading by hand.
          Verify any file with \`SHA256SUMS.txt\`, or check where it was built with
          \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" dist/ClipSave-* dist/clipsave-helper-* dist/clipsave-extension-* dist/install.sh dist/install.ps1 dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "ClipSave for browsers $VERSION" --notes-file RELEASE_NOTES.md $PRERELEASE
