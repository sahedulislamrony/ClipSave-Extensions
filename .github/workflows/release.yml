name: Release

# release.json decides releases. When a merge into main changes it, and the version it states is newer than
# the latest release, this runs every check again and, if they all pass, publishes a GitHub Release with the
# extension zips, the helper for macOS, Linux and Windows, and the installers. Merges that don't change release.json don't start it, and a
# version that isn't newer publishes nothing. After a failed run, start it again from
# Actions → Release → Run workflow on main; the same rules apply.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET   addons.mozilla.org API keys. When set, the release also has a signed
#                                    .xpi that installs in any Firefox. Without them that file is skipped.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release.json
        id: plan
        run: |
          VERSION=$(node scripts/version.mjs) || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if NEWER=$(node scripts/version.mjs --newer 2>&1); then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing: $NEWER." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing was published: $NEWER" >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  helper-macos:
    name: Helper for macOS
    needs: [plan, checks]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # One archive per kind of Mac, each with that chip's ffmpeg and QuickJS.
      - name: Build and package for Apple silicon and Intel
        run: |
          for arch in arm64 x86_64; do
            [ $arch = arm64 ] && target=aarch64-apple-darwin || target=x86_64-apple-darwin
            cargo build --release --manifest-path helper/Cargo.toml --target $target
            sh helper/fetch-engine.sh $arch
            sh scripts/package-helper.sh macos-$arch helper/target/$target/release/clipsave-helper
          done

      - uses: actions/upload-artifact@v4
        with:
          name: helper-macos
          path: dist/clipsave-helper-macos-*.tar.gz

  helper-linux:
    name: Helper for Linux
    needs: [plan, checks]
    # The oldest supported runner, so the binary runs on older Linux systems too.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and package with yt-dlp
        run: |
          cargo build --release --manifest-path helper/Cargo.toml
          sh helper/fetch-engine.sh
          sh scripts/package-helper.sh linux-x86_64 helper/target/release/clipsave-helper

      - uses: actions/upload-artifact@v4
        with:
          name: helper-linux
          path: dist/clipsave-helper-linux-x86_64.tar.gz

  helper-windows:
    name: Helper for Windows
    needs: [plan, checks]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and package with its tools
        run: |
          cargo build --release --manifest-path helper/Cargo.toml
          sh helper/fetch-engine.sh
          sh scripts/package-helper.sh windows-x86_64 helper/target/release/clipsave-helper.exe

      - uses: actions/upload-artifact@v4
        with:
          name: helper-windows
          path: dist/clipsave-helper-windows-x86_64.zip

  publish:
    name: Publish
    needs: [plan, checks, helper-macos, helper-linux, helper-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package the extension
        run: sh scripts/package-extension.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          path: dist
          merge-multiple: true

      - name: Sign the Firefox add-on
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx web-ext sign --channel unlisted \
            --source-dir .output/firefox-mv2 \
            --upload-source-code "dist/ClipSave-$VERSION-sources.zip" \
            --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv signed/*.xpi "dist/ClipSave-$VERSION-firefox.xpi"

      - name: Add the installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum ClipSave-* clipsave-helper-* install.sh install.ps1 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md for what changed." > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<EOF

          ---

          **Install:** add the extension, then click its button: it shows the one command that installs the helper.
          Full guide: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/install.md).

          - macOS, Linux: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\`
          - Windows (PowerShell): \`irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex\`

          Extension: \`ClipSave-$VERSION-chrome-unpacked.zip\` for Chrome, Edge and Brave, or the Firefox add-on.
          Verify any file with \`SHA256SUMS.txt\`.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "v$VERSION" dist/ClipSave-* dist/clipsave-helper-* dist/install.sh dist/install.ps1 dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "ClipSave for browsers $VERSION" --notes-file RELEASE_NOTES.md $PRERELEASE
