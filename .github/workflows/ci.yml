name: CI

# Runs on every pull request into dev or main, and on main after a merge (that run drives the README badge,
# so a failing pull request elsewhere doesn't turn it red). The Release workflow also runs it before publishing.
# A direct push to dev (maintainer only) runs no checks.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # What ships in the extension. Build tools stay out, so a dev-only advisory doesn't block a release.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --file helper/Cargo.lock

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Versions agree
        run: node scripts/version.mjs

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build Chrome and Firefox
        run: npm run build

      - name: Lint the Firefox build
        run: npm run lint:firefox

      # Both come with GitHub's Ubuntu runners.
      - name: Check the installers
        run: |
          shellcheck -s sh scripts/install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
            $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }
            if ($errors) { exit 1 }'

  helper:
    name: Helper (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Linux arm64, os: ubuntu-22.04-arm }
          - { name: Windows, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
    defaults:
      run:
        working-directory: helper
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: helper

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit and protocol tests
        run: cargo test --locked

  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: helper

      - name: Make sure Chrome and Firefox are installed
        if: runner.os == 'macOS'
        run: |
          test -d "/Applications/Google Chrome.app" || brew install --cask google-chrome
          test -d "/Applications/Firefox.app" || brew install --cask firefox

      - run: npm ci

      - name: Build the extension
        run: npm run build

      # fetch-engine.sh brings yt-dlp, ffmpeg and QuickJS, the same as a release, so nothing else is installed.
      - name: Build the helper and fetch its tools
        run: |
          cargo build --release --locked --manifest-path helper/Cargo.toml
          sh helper/fetch-engine.sh

      - name: Chrome
        run: npm run e2e:chrome

      - name: Firefox
        if: success() || failure()
        run: npm run e2e:firefox

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots-${{ matrix.name }}
          path: e2e/screenshots/
          if-no-files-found: ignore
